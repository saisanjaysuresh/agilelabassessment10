name: Temperature Converter Full Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    # STAGE 1 & 2
    - name: Checkout Code
      uses: actions/checkout@v4

    # STAGE 3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Automated Tests
      run: |
        python test_app.py

    # STAGE 4
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:latest

    # STAGE 5
    - name: Deploy to Kubernetes Cluster (Validation Mode)
      run: |
        echo "Exposing application through a Service load balancer configuration..."
        sed -i "image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:${{ github.sha }}|" k8s/deployment.yaml
        cat k8s/deployment.yaml
        echo "Successfully verified deployment structure using unique image tag: ${{ github.sha }}"
