name: Temperature Converter Full Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    # STAGE 1 & 2: Source Code & Version Control
    - name: Checkout Code
      uses: actions/checkout@v4

    # STAGE 3: Continuous Integration (Install & Test)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Automated Tests
      run: |
        python test_app.py

    # STAGE 4: Build Docker Image & Push to Docker Hub (Using unique Git SHA tag)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:latest

    # STAGE 5: Kubernetes Deployment (Applies the unique image tag)
    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
        
    - name: Deploy to Kubernetes Cluster
      run: |
        # Replaces the generic image name in your yaml with the unique tag from this push
        sed -i "image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:${{ github.sha }}|" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
