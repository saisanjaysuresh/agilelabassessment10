apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: converter-app
        image: python:3-slim
        command: ["python", "app.py"]
